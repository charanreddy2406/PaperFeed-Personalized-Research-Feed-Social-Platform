services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: paperfeed
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: paperfeed
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U paperfeed']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
  migrate:
    build: .
    env_file: .env
    command: [python, -m, scripts.migrate]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    env_file: .env
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build: .
    env_file: .env
    command: [python, -m, paperfeed.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ['${HTTP_PORT:-8080}:80','${HTTPS_PORT:-8443}:443']
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes: [caddydata:/data,caddyconfig:/config]
    depends_on: [api]
volumes:
  dbdata:
  caddydata:
  caddyconfig:
